<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ejercicio5.css">
    <title>Ejercicio 5 - Sistema de Notas</title>
</head>
<body>
    <div class="container">
        <form class="form" id="gradesForm">
            <div class="form-header">
                <div class="icon-container">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                    </svg>
                </div>
                <h1 class="title">Sistema de Notas</h1>
                <p class="subtitle">Registra las calificaciones del estudiante</p>
            </div>

            <!-- Nombre del estudiante -->
            <div class="input-group">
                <label class="label">Nombre del Estudiante</label>
                <input 
                    type="text" 
                    id="studentName" 
                    class="input" 
                    placeholder="Ingrese el nombre completo"
                >
                <span class="error-message" id="errorStudentName"></span>
            </div>

            <!-- Tres notas -->
            <div class="grades-grid">
                <div class="input-group">
                    <label class="label">Nota 1</label>
                    <input 
                        type="number" 
                        id="grade1" 
                        class="input input-grade" 
                        placeholder="0.0 - 5.0"
                        step="0.1"
                        min="0"
                        max="5"
                    >
                    <span class="error-message" id="errorGrade1"></span>
                </div>

                <div class="input-group">
                    <label class="label">Nota 2</label>
                    <input 
                        type="number" 
                        id="grade2" 
                        class="input input-grade" 
                        placeholder="0.0 - 5.0"
                        step="0.1"
                        min="0"
                        max="5"
                    >
                    <span class="error-message" id="errorGrade2"></span>
                </div>

                <div class="input-group">
                    <label class="label">Nota 3</label>
                    <input 
                        type="number" 
                        id="grade3" 
                        class="input input-grade" 
                        placeholder="0.0 - 5.0"
                        step="0.1"
                        min="0"
                        max="5"
                    >
                    <span class="error-message" id="errorGrade3"></span>
                </div>
            </div>

            <!-- Botón de cálculo -->
            <button type="submit" class="submit-btn">
                <span class="btn-text">Calcular Promedio</span>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>

            <!-- Resultado -->
            <div class="result-card" id="resultCard">
                <div class="result-row">
                    <span class="result-label">Promedio:</span>
                    <span class="result-value" id="average">0.0</span>
                </div>
                <div class="status-badge" id="statusBadge">
                    <span id="statusText">-</span>
                </div>
            </div>

            <!-- Mensaje general -->
            <div class="mensaje" id="mensaje"></div>
        </form>
    </div>

    <script src="ejercicio5.js"></script>
</body>
</html>
