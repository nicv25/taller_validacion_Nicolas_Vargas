<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ejercicio8.css">
    <title>Ejercicio 8 - Formulario Médico</title>
</head>
<body>
    <div class="container">
        <form class="form" id="medicalForm">
            <div class="form-header">
                <div class="icon-container">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                    </svg>
                </div>
                <h1 class="title">Registro de Pacientes</h1>
                <p class="subtitle">Cálculo de Índice de Masa Corporal</p>
            </div>

            <div class="input-group">
                <label class="label">Nombre Completo</label>
                <input 
                    type="text" 
                    id="name" 
                    class="input" 
                    placeholder="Ingrese el nombre del paciente"
                >
                <span class="error-message" id="errorName"></span>
            </div>

            <div class="flex-group">
                <div class="input-group">
                    <label class="label">Edad</label>
                    <input 
                        type="number" 
                        id="age" 
                        class="input input-center" 
                        placeholder="Años"
                        min="1"
                    >
                    <span class="error-message" id="errorAge"></span>
                </div>

                <div class="input-group">
                    <label class="label">Peso (kg)</label>
                    <input 
                        type="number" 
                        id="weight" 
                        class="input input-center" 
                        placeholder="0.0"
                        step="0.1"
                    >
                    <span class="error-message" id="errorWeight"></span>
                </div>
            </div>

            <div class="input-group">
                <label class="label">Estatura (cm)</label>
                <input 
                    type="number" 
                    id="height" 
                    class="input input-center" 
                    placeholder="0.0"
                    step="0.1"
                >
                <span class="error-message" id="errorHeight"></span>
            </div>

            <button type="submit" class="submit-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span>Calcular IMC</span>
            </button>

            <div class="result-card" id="resultCard">
                <div class="imc-display">
                    <p class="imc-label">Índice de Masa Corporal</p>
                    <p class="imc-value" id="imcValue">0.0</p>
                </div>
                
                <div class="classification-badge" id="classificationBadge">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="badge-icon">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <span id="classificationText">-</span>
                </div>

                <div class="info-box">
                    <h4 class="info-title">Rangos de IMC</h4>
                    <ul class="info-list">
                        <li><span class="bullet underweight">●</span> Bajo peso: &lt; 18.5</li>
                        <li><span class="bullet normal">●</span> Normal: 18.5 - 24.9</li>
                        <li><span class="bullet overweight">●</span> Sobrepeso: ≥ 25</li>
                    </ul>
                </div>
            </div>

            <div class="mensaje" id="mensaje"></div>
        </form>
    </div>

    <script src="ejercicio8.js"></script>
</body>
</html>
