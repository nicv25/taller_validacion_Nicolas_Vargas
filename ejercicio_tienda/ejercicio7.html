<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ejercicio7.css">
    <title>Ejercicio 7 - Tienda Virtual</title>
</head>
<body>
    <div class="container">
        <form class="form" id="storeForm">
            <div class="form-header">
                <div class="icon-container">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                </div>
                <h1 class="title">Tienda Virtual</h1>
                <p class="subtitle">Completa tu compra</p>
            </div>

            <div class="input-group">
                <label class="label">Producto</label>
                <input 
                    type="text" 
                    id="product" 
                    class="input" 
                    placeholder="Nombre del producto"
                >
                <span class="error-message" id="errorProduct"></span>
            </div>

            <div class="flex-group">
                <div class="input-group">
                    <label class="label">Precio</label>
                    <div class="input-prefix">
                        <span class="prefix">$</span>
                        <input 
                            type="number" 
                            id="price" 
                            class="input input-with-prefix" 
                            placeholder="0.00"
                            step="0.01"
                        >
                    </div>
                    <span class="error-message" id="errorPrice"></span>
                </div>

                <div class="input-group">
                    <label class="label">Cantidad</label>
                    <input 
                        type="number" 
                        id="quantity" 
                        class="input input-center" 
                        placeholder="0"
                        min="1"
                    >
                    <span class="error-message" id="errorQuantity"></span>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span>Calcular Total</span>
            </button>

            <div class="result-card" id="resultCard">
                <h3 class="result-title">Resumen de Compra</h3>
                <div class="result-row">
                    <span class="result-label">Subtotal:</span>
                    <span class="result-value" id="subtotal">$0.00</span>
                </div>
                <div class="result-row">
                    <span class="result-label">IVA (19%):</span>
                    <span class="result-value" id="iva">$0.00</span>
                </div>
                <div class="divider"></div>
                <div class="result-row total-row">
                    <span class="result-label-total">Total a Pagar:</span>
                    <span class="result-value-total" id="total">$0.00</span>
                </div>
            </div>

            <div class="mensaje" id="mensaje"></div>
        </form>
    </div>

    <script src="ejercicio7.js"></script>
</body>
</html>
